<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpDesk - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="module">
        import { loginUser } from './data.js';
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            if(loginUser(email, pass)) {
                const db = JSON.parse(localStorage.getItem('helpdesk_db'));
                const user = db.users.find(u => u.email === email);
                if(user.role === 'admin') window.location.href = 'admin.html';
                else if(user.role === 'technician') window.location.href = 'technician.html';
                else window.location.href = 'user.html';
            } else {
                alert("Invalid credentials. Try: admin@test.com / 123");
            }
        });
    </script>
    <style>
        :root { --bg-dark: #0c0e15; --primary-blue: #2563eb; --text-main: #ffffff; --bg-card: #141721; --border-color: #2a3040; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
        .login-box { background: var(--bg-card); padding: 40px; border-radius: 16px; border: 1px solid var(--border-color); width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .logo { text-align: center; font-size: 24px; font-weight: bold; color: var(--primary-blue); margin-bottom: 20px; }
        input { width: 100%; background: #1e2330; border: 1px solid var(--border-color); padding: 12px; border-radius: 8px; color: white; margin-bottom: 15px; outline: none; }
        button { width: 100%; padding: 12px; background: var(--primary-blue); border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        .helper { text-align: center; font-size: 12px; color: #8b92a5; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo"><i class="fas fa-headset"></i> HelpDesk</div>
        <form id="loginForm">
            <input type="email" id="email" value="admin@test.com" placeholder="Email Address" required>
            <input type="password" id="password" value="123" placeholder="Password" required>
            <button type="submit"><i class="fas fa-sign-in-alt"></i> Sign In</button>
        </form>
        <div class="helper">Demo: admin@test.com / tech@test.com / user@test.com (Pass: 123)</div>
    </div>
</body>
</html>
